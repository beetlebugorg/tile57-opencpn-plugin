name: CI

on:
  push:
    branches: [main]
  pull_request:

# The plugin links libtile57.a (the tile57 engine, built with Zig) and the vendored
# OpenCPN api-19 submodule. macOS builds against a real OpenCPN.app extracted from
# the release pkg, so the wxWidgets retarget/re-sign (cmake/fix-macos-libs.sh) runs
# the same way it does on a user's machine.

# The engine commit the plugin builds against. release.yml carries the same pin —
# bump both together when tracking a new engine.
env:
  TILE57_REF: 60fd2c4f38e0e338b1d982c91686385d0e6c3d3a

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pin the exact clang-format so the check matches local formatting byte-for-byte
      # (clang-format output drifts between versions). Only our own src/ — vendored
      # third_party/ and the opencpn-libs submodule are left alone.
      - name: clang-format check
        run: pipx run --spec "clang-format==22.1.8" clang-format --dry-run --Werror src/*.cpp src/*.h

  linux:
    strategy:
      fail-fast: false
      matrix:
        # Both Linux release targets (release.yml builds the same pair), so a
        # broken leg surfaces here instead of on tag day.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout plugin (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Checkout tile57 engine
        uses: actions/checkout@v7
        with:
          repository: beetlebugorg/tile57
          ref: ${{ env.TILE57_REF }}
          submodules: recursive
          path: tile57

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build tile57 (static lib)
        working-directory: tile57
        # `lib` builds ONLY libtile57.a (what the plugin links); the default step also
        # builds the host-only bake CLI, which can't cross-compile.
        run: zig build lib -Doptimize=ReleaseFast

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            libwxgtk3.2-dev \
            libglew-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTILE57_DIR="${{ github.workspace }}/tile57"

      - name: Build
        run: cmake --build build -j

      - name: Package (OpenCPN import tarball)
        run: cmake --build build --target package

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tile57_pi-linux-${{ runner.arch }}
          path: build/tile57_pi_*.tar.gz
          if-no-files-found: error

  # Best-effort Windows build. The plugin links the vendored MSVC OpenCPN import lib
  # (opencpn-libs/api-19/msvc-wx32/opencpn.lib), so tile57 must be built for the 32-bit
  # MSVC ABI too, and wxWidgets/GLEW come from OpenCPN's prebuilt cache (win_deps.bat).
  # A failure here does not block the Linux build.
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout plugin (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Checkout tile57 engine
        uses: actions/checkout@v7
        with:
          repository: beetlebugorg/tile57
          ref: ${{ env.TILE57_REF }}
          submodules: recursive
          path: tile57

      - name: Set up MSVC environment
        # OpenCPN for Windows is a 32-bit process, so the plugin (and tile57) must be x86.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build tile57 (MSVC-ABI static lib)
        working-directory: tile57
        # `lib` builds ONLY libtile57.a for the MSVC ABI; the default step also builds
        # the host-only bake CLI, which can't cross-compile. x86 = 32-bit, to match OpenCPN.
        run: zig build lib -Dtarget=x86-windows-msvc -Doptimize=ReleaseFast

      - name: Locate tile57 lib
        id: t57lib
        shell: bash
        run: |
          echo "=== tile57/zig-out tree ==="
          find tile57/zig-out -type f 2>/dev/null | sort || echo "(no zig-out)"
          # Search the whole zig-out, not just lib/, in case the archive lands elsewhere.
          lib=$(find tile57/zig-out \( -name '*.lib' -o -name '*.a' \) 2>/dev/null | head -1)
          echo "Found tile57 lib: $lib"
          if [ -z "$lib" ]; then echo "::error::no tile57 static lib produced by zig build lib"; exit 1; fi
          echo "path=$lib" >> "$GITHUB_OUTPUT"

      # wx + GLEW come from OpenCPN's own prebuilt 32-bit (vc14x) cache, not vcpkg:
      # building wxWidgets from source in vcpkg took 15-25 min. win_deps.bat downloads
      # the prebuilt binaries (self-installs wget/7z via choco) into OpenCPN/cache/,
      # which is exactly what the plugin's OCPN_SRC_DIR discovery reads.
      - name: Checkout OpenCPN (prebuilt 32-bit wx + GLEW)
        uses: actions/checkout@v7
        with:
          repository: OpenCPN/OpenCPN
          path: OpenCPN
          fetch-depth: 1

      - name: Fetch Windows deps (OpenCPN prebuilt wx/GLEW)
        working-directory: OpenCPN/buildwin
        shell: cmd
        run: win_deps.bat

      - name: Configure
        # -A Win32 keeps the plugin 32-bit to match OpenCPN's Windows process.
        run: >
          cmake -S . -B build -A Win32
          -DOCPN_SRC_DIR="${{ github.workspace }}/OpenCPN"
          -DTILE57_DIR="${{ github.workspace }}/tile57"
          -DTILE57_LIB="${{ steps.t57lib.outputs.path }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Package (OpenCPN import tarball)
        run: cmake --build build --target package --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tile57_pi-windows
          path: build/tile57_pi_*.tar.gz
          if-no-files-found: error

  # A plugin must match the arch OpenCPN runs as, and the universal app runs
  # natively on both — so build each arch on its own runner (Homebrew's wx and
  # GLEW are host-arch). No package step: cmake/Package.cmake has no macOS
  # layout, so the artifact is the bare retargeted dylib.
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      # The release pkg whose bundled wxWidgets the plugin is retargeted to.
      # Bump when tracking a new OpenCPN release.
      OCPN_PKG_URL: https://github.com/OpenCPN/OpenCPN/releases/download/Release_5.14.0/OpenCPN_5.14.0-universal%2B17193.91f3b6743-14.pkg
    steps:
      - name: Checkout plugin (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Checkout tile57 engine
        uses: actions/checkout@v7
        with:
          repository: beetlebugorg/tile57
          ref: ${{ env.TILE57_REF }}
          submodules: recursive
          path: tile57

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build tile57 (static lib)
        working-directory: tile57
        # `lib` builds ONLY libtile57.a (what the plugin links); the default step also
        # builds the host-only bake CLI. Native build — tile57's macOS lib repack
        # (macho-align.sh) can only run for the host arch.
        run: zig build lib -Doptimize=ReleaseFast

      # wxwidgets@3.2, not wxwidgets: Homebrew's main formula is wx 3.3, but
      # OpenCPN.app bundles 3.2 and the retarget only rebinds within the same
      # minor (wx keeps ABI across 3.2.x, not across 3.2 -> 3.3). The formula
      # installs its script as wx-config-3.2 to avoid clashing with the main
      # formula, so Configure names it explicitly.
      - name: Install build dependencies
        run: brew install wxwidgets@3.2 glew

      # Extract the app from the release pkg without installing it. The pkg's
      # install-location IS /Applications/OpenCPN.app, so its payload root is the
      # app's Contents/ directly — no directory named OpenCPN.app exists in the
      # expanded tree. Locate Contents/Frameworks (the only part the retarget
      # reads) and hand its app root to -DOCPN_APP; the POST_BUILD retarget
      # (cmake/fix-macos-libs.sh) then rebinds the plugin's wx references to the
      # app's bundled copies and re-signs ad hoc — exactly what a local build
      # against /Applications/OpenCPN.app does.
      - name: Fetch OpenCPN.app (bundled wxWidgets to retarget against)
        id: ocpn
        run: |
          curl -fsSL -o opencpn.pkg "$OCPN_PKG_URL"
          pkgutil --expand-full opencpn.pkg ocpn-pkg
          frameworks=$(find ocpn-pkg -type d -path "*/Contents/Frameworks" | head -1)
          if [ -z "$frameworks" ]; then
            echo "::error::no Contents/Frameworks in the expanded pkg"; find ocpn-pkg -maxdepth 3; exit 1
          fi
          echo "app=$PWD/$(dirname "$(dirname "$frameworks")")" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DTILE57_DIR="${{ github.workspace }}/tile57"
          -DOCPN_APP="${{ steps.ocpn.outputs.app }}"
          -DwxWidgets_CONFIG_EXECUTABLE="$(brew --prefix wxwidgets@3.2)/bin/wx-config-3.2"

      - name: Build
        run: cmake --build build -j

      # fix-macos-libs.sh warns-and-continues when the app is missing, so assert
      # the retarget actually happened: every wx reference must point into the
      # app bundle, or the plugin loads a second wxWidgets and never appears.
      - name: Verify wxWidgets retarget
        run: |
          otool -L build/libtile57_pi.dylib | grep wx
          if otool -L build/libtile57_pi.dylib | grep libwx | grep -v "@executable_path/../Frameworks/"; then
            echo "::error::wxWidgets reference not retargeted to OpenCPN.app"; exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tile57_pi-macos-${{ runner.arch }}
          path: build/libtile57_pi.dylib
          if-no-files-found: error
